name: Track MoneyMatter stable upstream (no auto deploy)
on:
  schedule:
    - cron: "25 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare official latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json;print(json.load(open("upstream-lock.json"))["stable_tag"])')"
          latest="$(gh api repos/letehaha/moneymatter/releases/latest --jq .tag_name)"
          test -n "$latest"
          if [ "$latest" = "$baseline" ]; then exit 0; fi
          title="Review MoneyMatter upstream $latest"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fx "$title" >/dev/null; then exit 0; fi
          gh issue create --title "$title" --body "MoneyMatter changed from $baseline to $latest. Before promotion, test the OAuth RFC6749 compatibility patch, MCPProxy token exchange, frontend FR parity, PostgreSQL migrations and rollback. Do NOT auto deploy."
